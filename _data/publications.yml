- title: "Aiding War: Foreign Aid and the Intensity of Violent Armed Conflict"
  coauthors: "with Michael Findley, Joseph K. Young, and Daniel Strandow"
  venue: "International Studies Quarterly"
  year: 2023
  volume: 67
  number: 3
  publisher: "Oxford University Press"
  type: "publication"
  link_label: "PDF"
  link: "/assets/pdf/isq.pdf"

#Abstract: Does foreign aid reduce violence during ongoing wars? In the policy community, there has been growing optimism about the prospect for aid to improve conflict-affected and fragile areas. We investigate whether foreign aid decreases, or even increases, violence during ongoing armed conflict. We advance a theoretical argument that concentrated foreign assistance allocated during ongoing armed conflicts increases military fatalities but decreases civilian fatalities. Using geographically coded data on all sub-Saharan African countries in conflict between 1989 and 2008, within a matching frontier design and supplemented by instrumental variable analysis, we find strong substantive and statistical support for our expectations about military conflict intensity though less support for the expectations about civilian fatalities. The paper provides novel insights about the effects of concentrated aid on military versus civilian conflict intensity, characterizes the effects at a sub-national level, and expands the spatial-temporal period of the analysis. We also probe the plausibility of the causal mechanism using interview evidence drawn from ex-commanders of the Lord’s Resistance Army and generals of the Ugandan People’s Defence Forces in northern Uganda. The paper offers both academic and policy insights, including that foreign aid allocated during ongoing wars may be more problematic than it is helpful.


- title: "A Field Experiment Using Social Media Ads to Encourage COVID-19 Vaccination"
  coauthors: "with Jiseon Chang, Roman Hlatky, Huimin Li, and Daniel L. Nielson"
  venue: "PNAS Nexus"
  year: 2024
  volume: 3
  number: 8
  publisher: "Oxford University Press"
  type: "publication"
  link_label: "PDF"
  link: "/assets/pdf/pnasnexus.pdf"

#Abstract: Behavioral nudges in Facebook ads reached nearly 15 million people across six diverse countries and, consequently, many thousands took the step of navigating to governments’ vaccine signup sites. However, none of the treatment ads caused significantly more vaccine signup intent than placebo uniformly across all countries. Critically, reporting the descriptive norm that 87% of people worldwide had either been vaccinated or planned vaccination—social proof—did not meaningfully increase vaccine signup intent in any country and significantly backfired in Taiwan. This result contradicts prominent prior findings. A charge to “protect lives in your family” significantly outperformed placebo in Taiwan and Turkey but saw null effects elsewhere. A message noting that vaccination significantly reduces hospitalization risk decreased signup intent in Brazil and had no significant effects in any other country. Such heterogeneity was the hallmark of the study; some messages saw significant treatment effects in some countries but failed in others. No nudge outperformed the placebo in Russia, a location of high vaccine skepticism. In all, widely touted behavioral nudges often failed to promote vaccine signup intent and appear to be moderated by cultural context.

- title: "Fleeing (in)voluntarily: How Projected Patriotism Affects Attitudes Towards Conflict Migrants"
  type: "working-paper"
  note: "Available upon request"
  link_label: "Draft"
  link: "/assets/pdf/Olgahan_JMP.pdf"

#Abstract: What shapes attitudes towards conflict migrants? A growing literature points out the events that cause displacement, which can be grouped as voluntary (economic migrants) and involuntary (refugees), and the latter has been shown to elicit more positive attitudes than the former. The effect of common conflict types such as civil war, invasion, or gang violence, which does not immediately signal deliberate targeting as in the case of ethnic or religious persecution, is yet to be tested. Further, the distinction between voluntary and involuntary migration is based on assumptions that need to be addressed. While involuntary migration is argued to attract more sympathy than voluntary migration, I argue that fleeing conflict events such as, civil war, invasion or gang violence, which constitute the main driver for the majority of forced displacements is not necessarily perceived as an involuntary act. To explain when and how people perceive it as a voluntary act, I introduce the concept of patriotism called \textit{Projected Patriotism}. People who embrace this notion expect citizens of other countries to act in patriotic ways and judge them accordingly, shaping their attitudes toward refugees. Employing conjoint survey experiments in the United States and Turkey, I test these hypotheses. While conflict refugees are preferred more than economic migrants, the evidence suggests that this preference disappears with individuals with high Projected Patriotism in Turkey. The findings challenge the existing understanding about what constitutes voluntariness of migration and its effects on attitudes. 

