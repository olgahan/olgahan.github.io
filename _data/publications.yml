- title: "The Legitimacy of Wartime Emigration: Evidence from a Conjoint Experiment in Ukraine"
  coauthors: "with Betty Compton, Roman Hlatky, Holly Jansen, Amy Liu, and Eoin Power"
  type: "working-paper"
  note: "Available upon request"
  link_label: "Pre-Analysis Plan"
  link: "/assets/pdf/.pdf"

#Abstract: Why do some citizens support wartime emigration while others oppose it? Wartime emigration activates moral heuristics grounded in perceived vulnerability, civic duty, and merit. These heuristics shape judgments of departure legitimacy, depending on who leaves, why, and under what conditions. Prior research largely focuses on how host-country publics respond to immigrants, leaving open how wartime emigration is judged by those who stay behind. They offer a broader framework for how moral expectations structure emigration decisions during crisis. The legitimacy of exit during armed conflict poses moral and political dilemmas for those who remain: leaving may signal vulnerability and necessity or suggest disloyalty and avoidance of obligation. We field a paired-profile conjoint experiment in a 2023 survey of Ukrainian citizens to examine how the identity and motivations of emigrants shape public evaluations of wartime departure. Respondents evaluated hypothetical profiles on support for departure, perceived right to leave, and preference for government restriction. These outcomes reflect distinct moral intuitions about compassion, entitlement, and obligation. Judgments reflect overlapping heuristics of humanitarian concern, civic obligation, and merit-based recognition. Mothers fleeing bombardment receive strong support, while conscription-age men receive lower support, especially when departure is framed as voluntary. Highly educated or urban profiles elicit ambivalence, as their symbolic contribution to national cohesion may heighten perceptions of loss when they emigrate. These findings show how wartime conditions structure civic expectations and inform moral assessments of emigration. We argue that such judgments are structured by civic obligation, vulnerability, and perceived necessity. Departures viewed as elective rather than survival-driven provoke sharper moral resistance, particularly when civic expectations of sacrifice remain salient under threat.

- title: "Sound And Fury, Signifying Nothing? An Empirical Test Of Russian Influence In Asia And Eastern Europe"
  coauthors: "with Jiseon Chang, Danny Cowser, Nivedita Jhunjhunwala, Daniel L. Nielson, and Eoin Power"
  type: "working-paper"
  note: "Available upon request"
  link_label: "Pre-Analysis Plan"
  link: "/assets/pdf/PAP_Ukraine.pdf"
  
#Abstract: #Russia’s incursion into the Donbas in 2014 and its subsequent meddling in the 2016 U.S. election prompted an avalanche of writing on Russian influence and information operations abroad, and now, following Russia’s invasion of Ukraine in 2022, the topic has never been more salient. But we have little empirical knowledge of how Russia’s supposed influence affects meaningful behavioral outcomes. To address this gap, we execute an online field experiment in Serbia, Turkey, India, Estonia, and Kazakhstan. In all five countries, pro-Russian perspectives play a documented and influential role in shaping public opinion, or there are strong historical, cultural, and strategic reasons for (some) citizens to adopt pro-Russian attitudes. Using A/B testing on Facebook’s ad platform, we solicit donations to an NGO supporting Ukrainian refugees while randomly assigning the accompanying imagery and messaging, and we use click rates on the donation link as our main outcome variable. In doing so, we test two main interventions – appeals to shared suffering, and primes emphasizing strategic links to Russia. And we use a meaningful behavioral outcome to deliver contemporaneous insight into how existing linguistic, cultural, economic, and strategic ties interact with historical perceptions of suffering.

- title: "Language and Voting Behavior among Asian Americans: The Case of the 2024 US Presidential Elections"
  coauthors: "with Amy Liu, Jangai Jap, Keith Chew and others"
  type: "working-paper"
  note: "Available upon request"
  link_label: "Draft"
  link: "/assets/pdf/AAPI.pdf"

#Abstract: Survey data from before the 2024 election about Asian American voting behavior did not match exit poll numbers. What explains this discrepancy? In this note we argue there are methodological limitations – specifically with the data collection process. Existing surveys systematically under-sample English-limited Asian Americans – a population that is almost 44% of the community. Consider how less than 2% of the Asian respondents in the CMPS took the survey in an Asian language. Since linguistic proficiency is not randomly distributed, what this means is that research on Asian Americans is largely biased towards liberals and Democrats. We fielded an original survey that draws on extensive, targeted recruiting of the Asian American community (N=4956) – of which 28% of the respondents took the survey in a non-English language. Our results not only match exit polls but also highlight – on average – a 14% gap in Democrat support between English and non-English language speakers in the Asian American community. This note offers a workflow for future researchers to think about how to sample non-English speaking communities in the US with minimal financial barriers.
  
  
